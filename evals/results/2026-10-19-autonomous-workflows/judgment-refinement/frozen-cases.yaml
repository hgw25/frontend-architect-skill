  - id: field-eligibility-consistency
    title: 表单字段规则的跨路径一致性
    prompt: >-
      评审下面的表单处理逻辑。契约规定 disabled 字段不参与校验和提交。
      不需要设计通用规则引擎，请指出实际缺陷，给出小范围修复和有意义的测试。
    artifact: |
      async function processForm(fields, values, send) {
        const errors = {};
        for (const field of fields.filter(field => !field.disabled)) {
          if (field.required && !values[field.name]) errors[field.name] = 'Required';
        }
        for (const field of fields.filter(field => field.validate)) {
          const error = await field.validate(values[field.name], values);
          if (error) errors[field.name] = error;
        }
        if (Object.keys(errors).length) return { errors };
        const payload = Object.fromEntries(fields
          .filter(field => !field.disabled)
          .map(field => [field.name, values[field.name]]));
        return send(payload);
      }
    applicable_dimensions:
      - solution_complexity
      - correctness_boundary
      - verification_evidence
      - communication_quality
    must_observe:
      - 识别禁用字段仍运行自定义校验并可能阻塞提交
      - 统一相关处理路径的有效字段集合或等效策略
      - 区分 required 的空值规则和合法的零或 false，说明需依据字段契约
      - 通过禁用字段校验失败但仍可提交且不含该字段的行为验证
    fail_if:
      - 仅修改命名或拆函数而遗漏有效字段不一致
      - 为局部一致性问题引入通用规则引擎

  - id: proportional-design-documentation
    title: 按决策需要区分文档深度
    prompt: >-
      判断以下任务在编码前是否需要持久化设计文档，并说明最小准备和后续行动：
      A，公共按钮已有 spacing token，将间距从 8px 调成 6px，不改变交互和 API；
      B，已有列表页增加遵循现有 URL 筛选约定的状态筛选；
      C，三个应用迁移到统一登录状态，旧新会话接口并存两周，两个团队分阶段接手，
      用户身份、刷新与退出传播的所有权尚未确定。用户已授权实现，仓库没有额外审批要求。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - verification_evidence
      - communication_quality
    must_observe:
      - A 直接实施和适度验证，不因公共组件而要求设计文档
      - B 可简短说明数据流和验证后实施，不强制持久化文档
      - C 在改实现前需要技术文档，复用现有位置，拆出有依赖和验收的功能步骤，定义类型及函数或类契约，并包含架构图和数据流转图
      - 区分需要澄清的业务决策与不必要的文档审批
    fail_if:
      - 所有任务都强制先建文档或等待用户批准
      - 因共享文件或功能关键词机械决定文档深度
      - C 不处理所有权歧义就直接实施迁移
      - C 将技术文档缩减为仅记录取舍或聊天中的简短提纲，遗漏功能步骤、代码契约或两类图示要求
  - id: field-eligibility-executable

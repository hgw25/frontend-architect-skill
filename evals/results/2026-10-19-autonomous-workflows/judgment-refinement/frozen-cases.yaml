      - 技术文档缺少功能到代码契约的映射、可执行步骤或任一必要图示，或图示无法解析、仅为目录树与重复空泛框图
      - 等待用户批准文档而未完成已授权实现
      - 受保护检查失败或被修改，或为同步字段条件引入通用规则引擎与强制抽象类


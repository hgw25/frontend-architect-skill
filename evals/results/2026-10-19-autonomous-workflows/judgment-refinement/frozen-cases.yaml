  - id: readiness-claims-match-exercised-evidence
    title: 就绪与兼容结论不超过实际验证边界
    prompt: >-
      请审查这份 Dialog 的交付结论，并给出替换现有 docs/dialog-verification.md 的完整内容。
      只维护这份记录，保留来源和后续验收入口；本轮不重新实现组件或搭建浏览器环境。
      现有实现提供 Root、Trigger、Portal 和 Content 等 API，portal 在 effect 后创建。
      产品要求受控/非受控、嵌套焦点恢复，以及 SSR 与客户端水合。
      根据现有材料给出可负责的就绪判断，区分已证明、已发现问题和仍待验证的部分。
    artifact: |-
      docs/dialog-verification.md
      # Dialog 交付验证
      结论：已可发布；SSR 和首轮水合兼容，焦点恢复完整。
      来源：logs/typecheck.log、logs/build.log、logs/package.log、logs/ssr.log、logs/browser.log。
      现有后续验收入口：npm run test:browser；hydrateRoot 消费者检查尚未加入。

      logs/typecheck.log
      npm run typecheck: exit 0

      logs/build.log
      npm run build: exit 0

      logs/package.log
      npm run test:package: exit 0; packed exports can be imported

      logs/ssr.log
      renderToString: 2 passed; no browser globals accessed during server rendering
      No hydrateRoot or client hydration was executed.

      logs/browser.log
      Generator sandbox: Chromium launch denied before assertions (Mach IPC).
      Later host check: original focus trap and nested Escape checks passed.
      Added outside-pointer check failed: dialog hidden, trigger expected focused, received inactive.
      No browser hydration check was selected.
    applicable_dimensions: [requirements_context, solution_complexity, compatibility_evolution, verification_evidence, communication_quality]
    must_observe:
      - 更新同一份记录，保留测试来源、生成期限制与后续宿主结果的区别
      - 类型、构建、包导入及服务端 renderToString 分别支持有限结论，不冒充客户端水合或完整可发布证明
      - 将外部点击后的焦点恢复失败作为已发现问题，而不是笼统写所有浏览器场景均未验证
      - 水合属于未验证，不虚构不兼容的根因；后续检查使用现有入口并补真实 hydrateRoot 消费者路径
      - 直接给出有边界的记录，不为文档维护扩展成组件重写、全局治理机制或常规审批
    fail_if:
      - 仍宣称完整可发布、焦点恢复全通过或水合兼容已被现有检查证明
      - 把服务端 renderToString 通过直接等同于 hydrateRoot 验证通过
      - 因生成沙箱失败而忽略后续宿主已确认的焦点缺陷，或把后续宿主结果冒认为生成期已执行
      - 没有证据就断言水合失败的原因并建议重写平台或增加框架


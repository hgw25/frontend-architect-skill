version: 1
cases:
- id: autonomous-export-async-encoding
  title: 冻结首轮实现后的异步编码接手
  prompt: '导出的编码现在由项目新增的 `src/codec.mjs` 异步编码器提供。两个入口继续保持原有公开行为，

    编码失败应把原错误交给调用者，成功编码后才可以提交。等待编码期间选择发生变化，

    不能改变这次已经提交的意图。完成这项变化。

    '
  artifact: ''
  fixture: evals/fixtures/export-followup
  protected_paths:
  - test/export.test.mjs
  - test/stage-two.test.mjs
  - src/codec.mjs
  validation_commands:
  - node --test
  applicable_dimensions:
  - requirements_context
  - solution_complexity
  - module_boundaries
  - paradigm_choice
  - implementation_integrity
  - correctness_boundary
  - verification_evidence
  - communication_quality
  must_observe:
  - 新编码能力仅由操作所有者接入，入口不理解编码步骤，原有行为和失败与意图快照检查均通过
  fail_if:
  - 受保护检查失败或被修改，或调用方开始维护编码顺序，或用重写入口规避内聚所有者

version: 1
cases:
- id: autonomous-filter-stock-evolution
  title: 冻结筛选实现后的商品库存接手
  prompt: '商品筛选增加库存条件。现有数据模块现在提供 `availableProductIds`，其中的商品有库存。

    使用 Product stock 下拉框提供 All / In stock / Out of stock，值分别为空字符串、in、out，

    已生效值写入 `p_stock`。沿用商品的 Apply、Reset、URL 和历史行为，Reset 恢复 All。

    订单筛选保持原有行为。完成这项需求。

    '
  artifact: ''
  fixture: evals/fixtures/filter-followup
  protected_paths:
  - package.json
  - package-lock.json
  - playwright.config.mjs
  - scripts/serve.mjs
  - tests/filters.spec.mjs
  - tests/stock.spec.mjs
  - src/data.mjs
  validation_commands:
  - npm ci
  - npx playwright install chromium
  - npm run check
  applicable_dimensions:
  - requirements_context
  - solution_complexity
  - module_boundaries
  - paradigm_choice
  - implementation_integrity
  - correctness_boundary
  - user_experience
  - verification_evidence
  - communication_quality
  must_observe:
  - 新条件融入商品状态、查询和既有控件，订单语义不变，变化落点有依据且检查通过
  fail_if:
  - 受保护检查失败或被修改，或商品变化迫使订单理解库存语义，或为单一字段建设无依据通用引擎

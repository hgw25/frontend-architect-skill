version: 1
cases:
  - id: abstraction-name-matches-responsibility
    title: 命名暴露混合职责而非只换目录名
    prompt: >-
      order.types.ts 中有工单类型、状态显示标签、标题校验和 localStorage 读写，
      data/manager.ts 只转发这些函数；项目没有对 data 或 manager 的特定约定。
      请改善命名和职责组织，不需要生成完整项目。
    artifact: ''
    applicable_dimensions: [module_boundaries, developer_experience, solution_complexity]
    must_observe:
      - 指出 types 文件名称与运行时职责不符，明确持久化边界
      - 使名称和内容对应，允许相关领域类型与规则合理共置
      - 检查无政策转发层是否值得保留，不只是换名字
    fail_if:
      - 只换目录名称却保留混合职责和含糊转发层
      - 一概禁止 model 或 service 等已有明确含义的项目术语
      - 为每个常量和类型机械创建独立文件及目录

  - id: centralized-tests-follow-project-contract
    title: 集中测试按业务对应源码并保持执行范围
    prompt: >-
      用户明确希望测试集中放在 tests 下。现有 Vitest 配置仅发现 src 下的测试，
      setup 在 src/test-setup.ts，工单测试散在 src 根目录和组件旁。
      请说明迁移方案和验收方式，不新增业务功能。
    artifact: ''
    applicable_dimensions: [module_boundaries, verification_evidence, requirements_context]
    must_observe:
      - 尊重集中测试偏好，在 tests 中建立可对应工单业务的组织
      - 调整发现范围、setup 和导入路径
      - 核对原有用例确实执行且断言未被弱化，不以命令退出成功代替验收
    fail_if:
      - 强制继续将测试放在组件旁而忽视明确偏好
      - 只移动文件而遗漏测试发现范围或 setup

  - id: ecosystem-before-folder-template
    title: 沿用框架约定而非统一目录模板
    prompt: >-
      现有 Next.js App Router 项目在 app 下使用 page.tsx 与 layout.tsx，
      现在增加一个工单页面和创建表单。请说明文件与状态归属，不需要完整代码。
    artifact: ''
    applicable_dimensions: [module_boundaries, requirements_context]
    must_observe:
      - 沿用现有路由和布局约定，说明页面与表单的职责
      - 表单拥有草稿和局部交互，工单数据有明确所有者
    fail_if:
      - 强制改为 pages 或 views 路由以满足统一模板
      - 无实际职责而叠加 pages features modules 三层转发

  - id: scaffold-is-not-business-architecture
    title: 入口业务堆积需要实际职责拆分
    prompt: >-
      一个 React Vite 工单应用的 App.tsx 包含应用顶栏、创建表单草稿与焦点、
      列表筛选、归档切换、单条工单操作和本地存储解析。现在增加工单编辑，
      请给出文件、状态与依赖的调整方案，并说明编辑和存储格式变化各影响哪里。
    artifact: ''
    applicable_dimensions: [module_boundaries, solution_complexity, developer_experience]
    must_observe:
      - 明确入口或页面协调与具体交互、业务规则、存储边界的职责
      - 用独立文件表达有意义的组件，草稿焦点等由交互组件拥有
      - 分别解释交互和存储格式变化的修改范围
    fail_if:
      - 因为项目小或没有复用而继续将全部职责堆在 App
      - 只移动 JSX 而所有局部状态和处理仍由 App 拥有
      - 将全部职责原样搬入一个巨大 Hook 并声称完成架构设计
      - 仅按行数证明设计合理

  - id: avoid-ceremonial-page-layers
    title: 必要设计不等于补齐目录
    prompt: >-
      现有单页应用采用 pages/orders，页面私有组件在其 components 下，
      数据读写在 orderStorage.ts，状态所有权清楚。只需修改筛选按钮文案。
      同事建议新增 features/orders、modules/orders 和通用存储仓库层。请完成判断。
    artifact: ''
    applicable_dimensions: [module_boundaries, solution_complexity]
    must_observe:
      - 保留适用的页面约定并局部修改文案
      - 工单专用存储格式仍属于业务边界，无需因使用浏览器 API 就公共化
    fail_if:
      - 为目录完整性或仅有未来可能复用而重构整个应用
      - 宣称 pages 与 features 永远不能共存或必须共存

  - id: anticipate-without-current-duplication
    title: 当前没有重复仍检查后续变化
    prompt: >-
      一个新订单页面只展示一个订单，运费目前固定为 10 元；直接在页面计算总价也能
      正确工作，没有重复代码、已有缺陷、第二个消费者或已承诺的运费路线图。
      请给出你会采用的简单实现结构及理由，不需要完整应用代码。
    artifact: ''
    applicable_dimensions:
      - solution_complexity
      - module_boundaries
      - compatibility_evolution
    must_observe:
      - 主动检查运费政策作为常见业务变化的可能性，不虚构已确定需求
      - 说明该政策改变时的修改位置，允许命名常量或局部函数等很小的边界
      - 当前实现可以保持简单，不强制额外文件或共享抽象
    fail_if:
      - 仅因没有路线图或重复就明确拒绝考虑任何后续变化
      - 没有辨认可能变化的业务政策或说明其修改位置
      - 提前实现多地区运费引擎或可配置规则系统

  - id: anticipate-small-boundary
    title: 无明确路线图也主动预留合理边界
    prompt: >-
      一个前端订单页首次接入接口，目前只有一个调用方，没有第二个数据源的路线图。
      页面直接使用接口字段 total_in_cents，格式转换与请求错误处理散在多个事件函数中。
      请提出便于使用和后续修改的实现边界，不需要完整应用代码。
    artifact: ''
    applicable_dimensions:
      - solution_complexity
      - module_boundaries
      - developer_experience
    must_observe:
      - 主动识别接口字段和错误处理是可能变化且已有分散成本的边界
      - 允许在单一调用方阶段集中适配和转换，使页面使用业务语义
      - 用现实调用或接口变化说明设计收益，不要求重复或路线图作为前提
    fail_if:
      - 仅因尚无第二个消费者就拒绝集中明确职责
      - 为可能的数据源变化预建插件注册和动态配置框架

  - id: convenience-without-framework
    title: 为常用调用提供适度便利
    prompt: >-
      项目的提示组件接收 tone、role、duration 三个参数。保存成功的调用都应采用
      positive、status、3000，而其他提示有不同语义。现在已有两个保存按钮要接入，
      请设计方便调用且仍能表达不同提示的接口，不需要完整组件实现。
    artifact: ''
    applicable_dimensions:
      - solution_complexity
      - developer_experience
      - module_boundaries
    must_observe:
      - 允许用语义化便捷入口或合理默认值集中成功提示策略
      - 保留其他真实提示语义的明确表达方式
      - 以调用便利和策略一致性判断封装价值
    fail_if:
      - 以所有封装都是冗余为由要求调用方重复整组策略
      - 建设没有需求的提示插件框架或复杂重载系统

  - id: trust-validated-internal-data
    title: 已验证领域对象避免重复防御
    prompt: >-
      接口适配层已运行时验证订单金额为有限数值并返回类型明确的对象。内部汇总函数
      只消费这些对象，不修改输入，没有其他入口。请给出汇总实现与错误处理原则，
      并说明将来增加外部输入入口时的调整位置。
    artifact: ''
    applicable_dimensions:
      - solution_complexity
      - security_trust
      - correctness_boundary
    must_observe:
      - 内部按已验证契约直接计算，复用适配层保障
      - 新外部入口需要明确输入验证的职责
      - 不用返回零或过滤异常项掩盖程序错误
    fail_if:
      - 给每个内部调用添加重复解析或防御包装器
      - 静默将无效金额转为零
      - 为简化而移除外部输入边界的运行时验证

  - id: retain-real-authorization
    title: 减少防御仍保留实际授权边界
    prompt: >-
      前端通过服务端接口删除文档，用户已登录，前端隐藏了其他人的删除按钮。
      现有服务端数据访问只验证文档存在，没有验证调用者是否能删除。请评审最小必要
      修复与前端职责，不实施部署，不扩建安全框架。
    artifact: ''
    applicable_dimensions:
      - solution_complexity
      - security_trust
      - correctness_boundary
    must_observe:
      - 明确服务端必须执行文档删除权限判断并复用已有鉴权能力
      - 前端呈现权限与失败信息，不能替代权威授权
      - 处理实际边界缺口，不在无关内部函数重复设防
    fail_if:
      - 以避免过度防御为由接受登录或隐藏按钮作为删除授权
      - 虚构数据访问已保证文档权限
      - 为局部授权缺口要求重建通用安全系统

  - id: reuse-existing-table-capability
    title: 优先复用现有成熟表格能力
    prompt: >-
      为现有前端表格增加多列排序和键盘导航，给出实现与验证方案。
      项目已安装 TableKit 4（本评测虚构库），现有页面使用其 Table 组件。
      下面是已核实与安装版本匹配的项目资料，无需联网。
    artifact: |
      TableKit 4 supports controlled multi-column sorting via sortModel/onSortModelChange.
      The existing project wrapper forwards both props and owns locale and keyboard navigation.
      Existing consumer tests cover focus after sorting and localized sort announcements.
      The requested behavior matches that documented contract; no extra dependency is needed.
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - verification_evidence
    must_observe:
      - 通过现有封装与已核实接口实现功能，复用其键盘与本地化策略
      - 验证多列排序结果、状态更新与排序后的焦点行为
      - 让维护者能从现有组件与测试定位行为，无需新增平行表格系统
    fail_if:
      - 在已满足需求的前提下自建排序引擎或键盘导航系统
      - 绕过现有封装而遗漏其本地化或焦点策略

  - id: trivial-formatting-without-dependency
    title: 简单局部逻辑无需新增依赖
    prompt: >-
      一个内部页面要把可能为 null 的展示名称去掉首尾空白，为空时显示“未命名”。
      只在一个地方使用，项目没有相关工具函数，输入类型为 string | null。
      请给出最小实现和验证建议。
    artifact: ''
    applicable_dimensions:
      - solution_complexity
      - correctness_boundary
      - verification_evidence
    must_observe:
      - 使用语言已有能力完成局部逻辑
      - 覆盖 null、空白字符串与普通名称的行为
      - 验证深度与低风险范围相称
    fail_if:
      - 为此添加第三方依赖或共享格式化框架
      - 把复用优先解释为所有简单操作都必须先做外部库调研

  - id: preserve-upstream-maintenance-flow
    title: 前端模板持续同步保留维护路径
    prompt: >-
      我们的前端项目从公司模板 fork 而来，以后每月都要更新模板。现在请给出同步方案，
      不能丢掉业务修改。已知 origin 指向团队 fork，尚未配置 upstream；模板仓库 URL
      已由团队确认可用，双方有共同 Git 历史，团队分支有已推送的业务提交，工作区
      还有未提交表单修改。项目已有构建和表单回归测试。无需实际执行命令。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - compatibility_evolution
      - operability
      - verification_evidence
    must_observe:
      - 先核对工作区、分支和远程关系，明确保留未提交修改的方法
      - 使用 Git 上游跟踪与历史集成机制支持后续重复同步
      - 处理业务冲突并运行已有构建和相关回归验证
      - 说明中止或恢复路径并记录后续可重复的同步方式
    fail_if:
      - 默认下载模板逐文件覆盖业务仓库或编写文件对比同步器
      - 默认丢弃未提交修改或强推重写团队已共享历史
      - 将双远程当作足以自动解决语义冲突和验证问题

  - id: group-by-api
    title: 通用 groupBy 封装
    prompt: >-
      请评审下面的 JavaScript groupBy 封装。判断它是否值得作为通用工具进入前端基础库，
      指出实际正确性和 API 设计问题，并给出符合现代前端工程约束的建议。不要只改写循环语法。
    artifact: |
      function groupBy(items, generateKey) {
        if (typeof generateKey === 'string') {
          const propertyName = generateKey
          generateKey = (item) => item[propertyName]
        }

        const result = {}
        let index = 0

        for (const item of items) {
          const key = generateKey(item, index++, items)
          if (result[key]) result[key].push(item)
          else result[key] = [item]
        }

        return result
      }
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - correctness_boundary
      - verification_evidence
      - communication_quality
    must_observe:
      - 检查目标环境的 Object.groupBy、Map.groupBy 和项目已有能力
      - 判断字符串重载是否有足够收益
      - 识别继承键碰撞、键强制转换和对象身份问题
      - 根据调用契约选择对象或 Map
      - 不因抽象显得高级而默认保留自定义工具
    fail_if:
      - 只讨论 for、reduce、代码行数或语法风格
      - 在没有兼容性说明时宣称某一种返回结构永远正确

  - id: role-folder-growth
    title: 全局职能目录膨胀
    prompt: >-
      一个持续增长的电商前端目前只有 components、hooks、services、stores、types
      和 utils 顶层目录。新增结算功能时，行为、状态、API、类型和测试要分散修改这些目录。
      请提出渐进式模块重构方案，并说明模块边界、公开 API 和依赖方向；不能一次性重写项目。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - module_boundaries
      - correctness_boundary
      - verification_evidence
      - communication_quality
    must_observe:
      - 依据变化、所有权和依赖方向分析
      - 倾向将结算行为、状态、API 和测试放入同一功能边界
      - 区分产品专属代码与真正共享的 UI、HTTP、日期能力
      - 给出增量迁移顺序而不是全仓重写
      - 定义公开 API 和跨功能协调位置
      - 在项目规模值得时用导入规则或包导出约束关键依赖方向
    fail_if:
      - 机械创建完整的多层架构模板
      - 只移动文件而不约束依赖或所有权

  - id: small-project-structure
    title: 小项目是否按 feature 分组
    prompt: >-
      一个内部工具只有两个页面、十几个源文件，目前目录很浅。团队考虑立即引入完整的
      feature/domain 分层。请判断是否应该这样做，并给出现在的结构建议以及未来触发迁移的信号。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - module_boundaries
      - communication_quality
    must_observe:
      - 允许项目保持浅层结构
      - 使用导航成本和真实变化模式判断
      - 在边界出现后增量迁移
      - 不把每个按钮或组件定义为 feature
    fail_if:
      - 以架构一致性为由创建大量单文件目录

  - id: feature-internal-decomposition
    title: 大功能内部的细粒度模块化
    prompt: >-
      一个 React 结算功能已经集中到 features/checkout，但 CheckoutPage.tsx 接近 900 行：
      它同时处理表单草稿、价格与优惠计算、优惠券请求、库存订阅、支付 SDK 生命周期、
      提交竞态、错误提示和全部 JSX。团队准备机械拆成 components、hooks、services、utils。
      请根据实际职责给出细致但不过度的内部模块划分，说明公开 API、状态与副作用所有权、
      内部依赖方向、测试放置和停止继续拆分的条件。不要以文件行数作为主要理由。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - module_boundaries
      - correctness_boundary
      - verification_evidence
      - communication_quality
    must_observe:
      - 从页面或公开入口、业务流程、纯规则、外部适配和有独立交互语义的 UI 多个尺度划分
      - 明确草稿、权威价格、提交状态和竞态的单一所有权
      - 将优惠券、库存和支付 SDK 视为不同外部契约与生命周期边界
      - 让纯定价规则不依赖 React、网络响应或支付 SDK
      - 定义外部消费者只使用窄公开入口，内部依赖不绕 barrel 隐藏循环
      - 保留与单一所有者共同变化的小 helper、类型、样式和测试，不为对称性建空层
      - 使用语义、变化原因、生命周期和契约决定组件或 hook 拆分，而不是行数或 JSX 区块
      - 说明新增边界隐藏了什么易变决策或复杂度，避免只改名转发调用的浅层模块
      - 用题目已有的优惠券、库存或 SDK 变化说明修改如何局限于对应所有者，不为演练新增扩展框架
    fail_if:
      - 只把原文件按 components、hooks、services、utils 分类移动
      - 用一个万能 hook、store 或 controller 继续拥有全部状态与副作用
      - 无条件建立每层目录、接口和依赖注入，即使没有替换或边界需求
      - 将只改名转发调用且继续泄漏相同数据、错误和生命周期的封装宣称为架构边界

  - id: editor-paradigms
    title: 富文本编辑器选择 FP 还是 OOP
    prompt: >-
      设计一个富文本编辑器模块。它包含 selection、history、纯文本转换、DOM 订阅、
      协作连接和销毁清理。请判断哪些部分适合纯函数、Reducer、状态机、闭包或类，
      并说明状态所有权、序列化、竞态和生命周期边界。不要把整个项目限定为纯 FP 或纯 OOP。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - paradigm_choice
      - correctness_boundary
      - communication_quality
    must_observe:
      - 将确定性文本转换、验证和状态转换放入函数式核心
      - 允许 session 或 controller 拥有身份、订阅、连接和清理
      - 明确对象状态与响应式 UI 状态的单一所有权
      - 优先组合或委托而不是继承层级
      - 考虑序列化、回放、竞态和卸载
    fail_if:
      - 宣称前端应全部函数式
      - 把全部逻辑放入一个 Editor 类

  - id: derived-state-effect
    title: 派生状态和 Effect
    prompt: >-
      请评审下面的 React 组件。保持公开行为不变，判断 state、Effect 和 memoization
      是否必要，并说明应该如何验证修改。
    artifact: |
      function UserList({ users, query }) {
        const [filteredUsers, setFilteredUsers] = useState(users)

        useEffect(() => {
          setFilteredUsers(
            users.filter((user) => user.name.includes(query)),
          )
        }, [users, query])

        return filteredUsers.map((user) => <User key={user.id} user={user} />)
      }
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - correctness_boundary
      - verification_evidence
      - communication_quality
    must_observe:
      - 识别重复事实和 Effect 同步风险
      - 建议渲染期间派生结果
      - 只有在证明计算昂贵后才考虑缓存
      - 区分用户事件和外部系统同步
      - 使用行为测试保护过滤结果而不是内部 state
    fail_if:
      - 只修改 Effect 依赖数组
      - 无依据增加 memoization


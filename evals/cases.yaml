      - 使用框架 profiler 与 Android 系统或帧 trace 定位跨层瓶颈
      - 在同一中端真机和代表性数据上对比修改前后滚动、帧和内存结果
      - 用行为或集成测试保护状态隔离、列表身份、图片契约和订阅释放
    fail_if:
      - 把所有问题归因于旧 Bridge 而不确认当前架构
      - 无测量地给所有行添加 memo 或直接采用另一列表库
      - 用模拟器、debug 构建或单一 render 计数声明性能已经改善

  - id: mini-program-render-transfer
    title: 小程序实时列表的渲染通信成本
    prompt: >-
      一个行情小程序页面展示约 500 行数据，每 100ms 收到一次更新，并通过 setData 传递整个
      页面 data；页面隐藏后订阅和更新仍继续。开发者工具中较流畅，但部分真机输入延迟、滚动
      卡顿。产品同时存在不同宿主和基础库版本。请给出不改变业务实时性要求的最小优化方案，
      并说明代码层可以验证什么、哪些结论仍需要宿主工具和代表性真机证据。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - rendering_performance
      - runtime_delivery
      - correctness_boundary
      - user_experience
      - verification_evidence
      - communication_quality
    must_observe:
      - 先确认宿主、基础库、渲染后端、设备和可用性能工具
      - 将逻辑层到渲染层的数据视为序列化边界，只传递渲染所需的变化
      - 根据语义合并更新、缩小变更路径并避免高频全页传输，同时保持实时反馈契约
      - 在隐藏和销毁生命周期停止无意义订阅、定时器和视图更新
      - 检查稳定列表身份、挂载节点、图片或其他资源成本，但不盲目自建虚拟列表
      - 使用宿主工具记录更新频率、载荷和队列，并在代表性真机验证输入、滚动和内存
      - 用行为或集成测试保护变化路径、隐藏与销毁清理以及恢复时的单一订阅
    fail_if:
      - 把某一宿主或历史版本的 setData 数值限制当作所有小程序的固定规则
      - 只做节流而不分析跨层传输、节点更新和隐藏页生命周期
      - 用开发者工具表现或更小 payload 单独证明用户卡顿已经解决

  - id: profile-domain-contract
    title: 个人主页身份与接口契约
    prompt: >-
      为已有 Vue 用户端设计个人主页的最小实施方案，视觉参考 GitHub。
      用户与开发者是两个身份体系。GET /users/{userId} 返回 profile 和 applications，
      服务端按查看者身份决定是否包含私有应用；旧生成注释仍写着 applications 仅公开。
      产品负责人已确认当前接口会向本人返回公开和私有应用。作者署名只有 developerLogin，
      没有 userId 映射。请说明路由、数据流、作者入口、实现顺序和验收方式。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - correctness_boundary
      - verification_evidence
      - communication_quality
    must_observe:
      - 使用用户身份设计主页，不把 developerLogin 当 userId
      - 按当前契约使用单一主页请求，不额外拼接私有应用
      - 明确作者跳转缺少映射，完成独立主页工作并报告未完成入口
      - 验证本人和他人访问、直达与错误状态
    fail_if:
      - 猜测身份映射或以开发者 login 构造用户主页
      - 用旧注释覆盖明确产品契约并额外请求私有数据
      - 将不可用作者入口描述为完整交付

  - id: covered-hover-diagnosis
    title: Hover 失败与测试假通过
    prompt: >-
      折叠侧栏最后一个按钮在实际应用中 hover 没反应。组件测试直接对按钮 dispatchEvent
      却通过。按钮由 Tooltip 和 Dropdown 组合；同版本上游 demo 正常。
      本地另有透明分组标题和负 margin。团队建议替换底层 Tooltip。请评估证据，给出下一步
      调查、最小修复的决策条件和验收方法。你目前不能运行应用。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - correctness_boundary
      - verification_evidence
      - communication_quality
    must_observe:
      - 区分未确认假设和事实，不从组合结构直接断言库冲突
      - 检查真实命中元素、几何覆盖和本地上游差异
      - 真实指针路径验证 hover 与点击，保留键盘行为
      - 明确没有运行应用，不宣称修复或根因已确认
    fail_if:
      - 在没有区分性证据时要求替换 Tooltip 或断言透明标题就是已确认根因
      - 以直接派发事件测试通过证明真实 hover 正常

  - id: remove-obsolete-interaction
    title: 删除交互后收敛内部结构
    prompt: >-
      一个会话面板取消 60% 停靠，现在只需全高展开、头部下拉收起、短拖回弹。
      当前实现隐藏了停靠按钮，但仍维护 sheetHeight、heightListener、WebView 中间高度绘制
      补偿，以及为这些行为透传的五个参数；这些代码仍会运行。项目已有全高收起动画。
      公共可调高度抽屉仍被其他页面使用。请给出最小重构方案和验证计划。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - module_boundaries
      - correctness_boundary
      - verification_evidence
    must_observe:
      - 按剩余行为重新评估可变高度机制，复用现有收起动画
      - 追踪并删除仅服务已取消行为的状态监听补偿与透传
      - 保留其他消费者依赖的公共抽屉能力
      - 验证短拖回弹、完整收起、重复手势和 WebView 展示及生命周期
    fail_if:
      - 以代码仍被调用为由保留全部旧机制
      - 只新增禁用停靠开关或者删除其他消费者仍需的公共能力

  - id: field-eligibility-consistency
    title: 表单字段规则的跨路径一致性
    prompt: >-
      评审下面的表单处理逻辑。契约规定 disabled 字段不参与校验和提交。
      不需要设计通用规则引擎，请指出实际缺陷，给出小范围修复和有意义的测试。
    artifact: |
      async function processForm(fields, values, send) {
        const errors = {};
        for (const field of fields.filter(field => !field.disabled)) {
          if (field.required && !values[field.name]) errors[field.name] = 'Required';
        }
        for (const field of fields.filter(field => field.validate)) {
          const error = await field.validate(values[field.name], values);
          if (error) errors[field.name] = error;
        }
        if (Object.keys(errors).length) return { errors };
        const payload = Object.fromEntries(fields
          .filter(field => !field.disabled)
          .map(field => [field.name, values[field.name]]));
        return send(payload);
      }
    applicable_dimensions:
      - solution_complexity
      - correctness_boundary
      - verification_evidence
      - communication_quality
    must_observe:
      - 识别禁用字段仍运行自定义校验并可能阻塞提交
      - 统一相关处理路径的有效字段集合或等效策略
      - 区分 required 的空值规则和合法的零或 false，说明需依据字段契约
      - 通过禁用字段校验失败但仍可提交且不含该字段的行为验证
    fail_if:
      - 仅修改命名或拆函数而遗漏有效字段不一致
      - 为局部一致性问题引入通用规则引擎

  - id: proportional-design-documentation
    title: 按决策需要区分文档深度
    prompt: >-
      判断以下任务在编码前是否需要持久化设计文档，并说明最小准备和后续行动：
      A，公共按钮已有 spacing token，将间距从 8px 调成 6px，不改变交互和 API；
      B，已有列表页增加遵循现有 URL 筛选约定的状态筛选；
      C，三个应用迁移到统一登录状态，旧新会话接口并存两周，两个团队分阶段接手，
      用户身份、刷新与退出传播的所有权尚未确定。用户已授权实现，仓库没有额外审批要求。
    artifact: ''
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - verification_evidence
      - communication_quality
    must_observe:
      - A 直接实施和适度验证，不因公共组件而要求设计文档
      - B 可简短说明数据流和验证后实施，不强制持久化文档
      - C 因跨团队所有权和迁移决策需要可追溯方案，复用项目现有文档位置
      - 区分需要澄清的业务决策与不必要的文档审批
    fail_if:
      - 所有任务都强制先建文档或等待用户批准
      - 因共享文件或功能关键词机械决定文档深度
      - C 不处理所有权歧义就直接实施迁移
  - id: field-eligibility-executable
    title: 实现有效字段统一契约
    prompt: >-
      请直接修复 fixture 的表单处理实现，遵守 README.md 的现有公共 API 与字段契约。
      禁用字段不校验、不提交且不能阻塞；required 区分空值与 0/false；异步校验保留具体错误。
      保持实现小而清楚，运行 npm run check，说明实际通过的检查与未验证的范围。
      不修改受保护测试或 package.json，不增加依赖。
    artifact: ''
    fixture: evals/fixtures/field-eligibility
    protected_paths:
      - README.md
      - package-lock.json
      - package.json
      - test/process-form.test.js
    validation_commands:
      - npm ci
      - npm run check
    applicable_dimensions:
      - requirements_context
      - solution_complexity
      - correctness_boundary
      - implementation_integrity
      - verification_evidence
      - communication_quality
    must_observe:
      - 用一致的有效字段策略贯穿 required、自定义校验与提交
      - 准确表达空值而不使用简单真假值校验
      - 等待异步校验、保留错误信息和已有异常传播契约
      - 通过公共 API 验证禁用字段不调用 validator 且不进入 payload
      - 运行验收且不修改受保护文件
    fail_if:
      - 测试仍失败或改弱受保护测试
      - 为局部表单流程引入通用规则引擎或依赖注入框架
      - 只拆函数或改名而没有消除跨路径契约不一致

  - id: search-request-lifecycle-executable
    title: 实现搜索请求所有权和稳定数据边界
    prompt: >-
      请直接修复 fixture 中 createSearch 的实现，按照 README.md 的公共契约维护草稿、
      提交查询和结果。只有最新启动请求能发布结果、错误和结束状态；transport 不支持取消。
      retry 必须使用已提交查询；dispose 后不再修改状态；API DTO 不进入公开 UI 数据。
      运行 npm run check，不改受保护测试或 package.json，不增加框架或依赖。
    artifact: ''
    fixture: evals/fixtures/search-request-lifecycle
    protected_paths:
      - README.md
      - package-lock.json
      - package.json

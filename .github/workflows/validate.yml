name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate skill, metadata, links, scripts, and eval fixtures
        run: python3 scripts/validate_skill.py
      - name: Test evaluation verdict and failure handling
        run: python3 scripts/test_score_behavior_evals.py
